{% extends "base.html" %}
{% block title %}Logs — BuySell365{% endblock %}
{% block content %}

<div class="bg-bs-card border border-bs-border rounded-lg p-4">
  <div class="flex flex-wrap gap-3 mb-3 items-center justify-between">
    <h1 class="text-xl font-bold">📜 Logs en vivo</h1>
    <div class="flex gap-2 flex-wrap">
      <button onclick="toggleAutoScroll()" id="autoscroll-btn" class="btn btn-ghost text-xs">📜 Auto-scroll ON</button>
      <button onclick="toggleStream()" id="stream-btn" class="btn btn-green text-xs">▶ Streaming ON</button>
      <button onclick="clearLogs()" class="btn btn-ghost text-xs">🧹 Limpiar</button>
      <button onclick="downloadLogs()" class="btn btn-blue text-xs">⬇ Descargar</button>
    </div>
  </div>

  <div class="flex gap-2 mb-3 flex-wrap items-center">
    <label class="flex items-center gap-1 text-sm"><input type="checkbox" id="f-info" checked class="accent-bs-blue"> INFO</label>
    <label class="flex items-center gap-1 text-sm"><input type="checkbox" id="f-warn" checked class="accent-bs-yellow"> WARN</label>
    <label class="flex items-center gap-1 text-sm"><input type="checkbox" id="f-err" checked class="accent-bs-red"> ERROR</label>
    <input type="text" id="search-input" placeholder="🔍 Buscar..." class="text-sm w-full sm:w-64" oninput="onFilterChange()">
  </div>

  <div id="logs-container" class="bg-bs-bg border border-bs-border rounded p-2 h-[60vh] overflow-y-auto font-mono text-xs">
    <div class="text-bs-text/40 text-center py-4">Cargando logs...</div>
  </div>

  <div class="text-xs text-bs-text/60 mt-2"><span id="line-count">0</span> líneas mostradas</div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
/* FIX 2026-05-26: rendering incremental — antes el template re-renderizaba
 * el array completo (2000 lineas) por cada mensaje SSE. Con el bot escribiendo
 * rapido, el navegador se congelaba. Ahora:
 *  - Cap de 500 lineas (suficiente para inspeccion en vivo).
 *  - Append incremental al DOM (no innerHTML full).
 *  - Carga inicial 100 lineas.
 *  - Filtros y busqueda usan re-render full pero solo cuando cambian filtros.
 *  - Recorte de DOM viejo: si pasa de MAX_DOM_LINES, quita el primero.
 */
const MAX_LINES = 500;          // cap en memoria
const MAX_DOM_LINES = 500;      // cap en DOM
const INITIAL_LINES = 100;      // carga inicial via /logs/tail

const container = document.getElementById('logs-container');
const autoScrollBtn = document.getElementById('autoscroll-btn');
const streamBtn = document.getElementById('stream-btn');
const lineCount = document.getElementById('line-count');
let autoScroll = true;
let streaming = true;
let evtSource = null;
let allLines = [];   // [{text, lvl}]
let placeholderShown = true;

function classifyLine(text) {
  const t = text.toUpperCase();
  if (t.includes('[ERROR]') || t.includes(' ERROR ')) return 'err';
  if (t.includes('[WARN]') || t.includes('[WARNING]') || t.includes(' WARN ')) return 'warn';
  if (t.includes('[INFO]')) return 'info';
  return 'info';
}

function colorClass(lvl) {
  return { 'info': 'text-bs-text/70', 'warn': 'text-bs-yellow', 'err': 'text-bs-red' }[lvl];
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shouldShow(line) {
  const showInfo = document.getElementById('f-info').checked;
  const showWarn = document.getElementById('f-warn').checked;
  const showErr = document.getElementById('f-err').checked;
  const q = document.getElementById('search-input').value.toLowerCase();
  if (line.lvl === 'info' && !showInfo) return false;
  if (line.lvl === 'warn' && !showWarn) return false;
  if (line.lvl === 'err' && !showErr) return false;
  if (q && !line.text.toLowerCase().includes(q)) return false;
  return true;
}

function makeLineDiv(line) {
  const div = document.createElement('div');
  div.className = colorClass(line.lvl) + ' py-0.5';
  div.dataset.lvl = line.lvl;
  div.textContent = line.text;  // textContent en vez de innerHTML — mas rapido y seguro
  return div;
}

function appendLineIncremental(line) {
  if (placeholderShown) {
    container.innerHTML = '';
    placeholderShown = false;
  }
  if (!shouldShow(line)) return;
  container.appendChild(makeLineDiv(line));
  // Recortar DOM si excede el cap
  while (container.childNodes.length > MAX_DOM_LINES) {
    container.removeChild(container.firstChild);
  }
  lineCount.textContent = container.childNodes.length;
  if (autoScroll) container.scrollTop = container.scrollHeight;
}

function addLine(text) {
  const lvl = classifyLine(text);
  const line = { text, lvl };
  allLines.push(line);
  if (allLines.length > MAX_LINES) allLines.shift();
  appendLineIncremental(line);
}

function fullRender() {
  // Solo se llama cuando cambian filtros o busqueda (eventos puntuales)
  const frag = document.createDocumentFragment();
  let shown = 0;
  for (const l of allLines) {
    if (!shouldShow(l)) continue;
    frag.appendChild(makeLineDiv(l));
    shown++;
  }
  container.innerHTML = '';
  if (shown === 0) {
    container.innerHTML = '<div class="text-bs-text/40 text-center py-4">Sin líneas que mostrar.</div>';
    placeholderShown = true;
  } else {
    container.appendChild(frag);
    placeholderShown = false;
  }
  lineCount.textContent = shown;
  if (autoScroll) container.scrollTop = container.scrollHeight;
}

// Debounce de filtros para evitar re-renders por cada keystroke en la busqueda
let filterDebounce = null;
function onFilterChange() {
  if (filterDebounce) clearTimeout(filterDebounce);
  filterDebounce = setTimeout(fullRender, 150);
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  autoScrollBtn.textContent = autoScroll ? '📜 Auto-scroll ON' : '📜 Auto-scroll OFF';
}
function clearLogs() {
  allLines = [];
  container.innerHTML = '<div class="text-bs-text/40 text-center py-4">Sin líneas que mostrar.</div>';
  placeholderShown = true;
  lineCount.textContent = 0;
}
function downloadLogs() {
  const blob = new Blob([allLines.map(l => l.text).join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'buysell365_logs_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.log';
  a.click();
}

function startStream() {
  if (evtSource) return;
  evtSource = new EventSource('{{ url_for("logs.stream") }}');
  evtSource.onmessage = (e) => addLine(e.data);
  evtSource.onerror = () => { console.warn('Stream error, reconnecting...'); };
  streamBtn.textContent = '⏸ Streaming ON';
  streamBtn.classList.remove('btn-green'); streamBtn.classList.add('btn-yellow');
}
function stopStream() {
  if (evtSource) { evtSource.close(); evtSource = null; }
  streamBtn.textContent = '▶ Streaming OFF';
  streamBtn.classList.remove('btn-yellow'); streamBtn.classList.add('btn-green');
}
function toggleStream() {
  streaming = !streaming;
  if (streaming) startStream(); else stopStream();
}

// Carga inicial (FIX: 100 lineas en vez de 200)
fetch('{{ url_for("logs.tail") }}?n=' + INITIAL_LINES)
  .then(r => r.text())
  .then(t => {
    const lines = t.split('\n').filter(l => l.trim());
    // Construir el batch inicial usando fragment para no re-renderizar N veces
    placeholderShown = false;
    container.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (const line of lines) {
      const lvl = classifyLine(line);
      const obj = { text: line, lvl };
      allLines.push(obj);
      if (shouldShow(obj)) frag.appendChild(makeLineDiv(obj));
    }
    container.appendChild(frag);
    lineCount.textContent = container.childNodes.length;
    if (autoScroll) container.scrollTop = container.scrollHeight;
    if (streaming) startStream();
  })
  .catch(err => {
    container.innerHTML = '<div class="text-bs-red text-center py-4">Error cargando logs: ' + escapeHtml(String(err)) + '</div>';
  });

['f-info','f-warn','f-err'].forEach(id => document.getElementById(id).addEventListener('change', fullRender));
</script>
{% endblock %}
